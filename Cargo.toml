[workspace]
resolver = "2"
members = [
    "crates/fleet-core",
    "crates/fleet-agents",
    "crates/fleet-memory",
    "crates/fleet-neural",
    "crates/fleet-security",
    "crates/fleet-swarm",
    "crates/fleet-workflows",
    "crates/fleet-federation",
    "crates/fleet-plugins",
    "crates/fleet-analyzer",
    "crates/fleet-hooks",
    "crates/fleet-providers",
    "crates/fleet-mcp",
    "crates/fleet-tui",
    "bins/ai-fleet",
]

[workspace.package]
version = "4.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
fleet-core = { path = "crates/fleet-core" }
fleet-agents = { path = "crates/fleet-agents" }
fleet-memory = { path = "crates/fleet-memory" }
fleet-neural = { path = "crates/fleet-neural" }
fleet-security = { path = "crates/fleet-security" }
fleet-swarm = { path = "crates/fleet-swarm" }
fleet-workflows = { path = "crates/fleet-workflows" }
fleet-federation = { path = "crates/fleet-federation" }
fleet-plugins = { path = "crates/fleet-plugins" }
fleet-analyzer = { path = "crates/fleet-analyzer" }
fleet-hooks = { path = "crates/fleet-hooks" }
fleet-providers = { path = "crates/fleet-providers" }
fleet-mcp = { path = "crates/fleet-mcp" }
fleet-tui = { path = "crates/fleet-tui" }
